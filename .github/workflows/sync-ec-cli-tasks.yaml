---
name: sync-ec-tasks

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

permissions:
  contents: read

jobs:
  branches:
    if: ${{ github.repository == 'conforma/tekton-catalog' }}
    runs-on: ubuntu-latest
    outputs:
      branches: ${{ steps.branches.outputs.branches }}

    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
      with:
        egress-policy: audit
        disable-telemetry: true

    - name: Find matching branches
      id: branches
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        catalog_branches=$(gh api --paginate repos/conforma/tekton-catalog/branches --jq '.[].name' | sort)
        cli_branches=$(gh api --paginate repos/conforma/cli/branches --jq '.[].name' | sort)
        branches=$(comm -12 <(echo "$catalog_branches") <(echo "$cli_branches") | grep -E '^(main|release-v.*)$')
        echo "branches=$(echo "$branches" | jq -R -s -c 'split("\n") | map(select(length > 0))')" >> "$GITHUB_OUTPUT"

  sync-ec-tasks:
    needs: branches
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        branch: ${{ fromJSON(needs.branches.outputs.branches) }}

    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
      with:
        egress-policy: audit
        disable-telemetry: true

    - name: Checkout sync tooling
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.sha }}
        path: sync-tooling

    - name: Checkout tekton-catalog
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ matrix.branch }}
        path: tekton-catalog

    - name: Checkout ec
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: conforma/cli
        ref: ${{ matrix.branch }}
        path: cli

    - name: Sync tasks
      run: ../sync-tooling/hack/sync-ec-cli-tasks.sh ../cli
      working-directory: tekton-catalog

    - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
      id: generate-token
      with:
        app-id: ${{ vars.EC_AUTOMATION_APP_ID }}
        private-key: ${{ secrets.EC_AUTOMATION_KEY }}

    - name: Create pull request
      uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
      with:
        path: tekton-catalog
        base: ${{ matrix.branch }}
        branch: sync/${{ matrix.branch }}
        commit-message: sync ec task and pipeline definitions
        sign-commits: true
        signoff: true
        title: "chore: sync task and pipeline definitions to ${{ matrix.branch }}"
        body: "Automated sync of task and pipeline definitions from conforma/cli `${{ matrix.branch }}`."
        token: ${{ steps.generate-token.outputs.token }}
