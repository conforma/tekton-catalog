---
name: sync-ec-tasks

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

permissions:
  contents: read

jobs:
  sync-ec-tasks:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:

    - name: Harden Runner
      uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
      with:
        egress-policy: audit
        disable-telemetry: true

    - name: Checkout tekton-catalog
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: conforma/tekton-catalog
        ref: main
        path: tekton-catalog

    - name: Checkout ec
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: conforma/cli
        ref: main
        path: cli

    - name: Sync tasks
      run: ./hack/sync-ec-cli-tasks.sh ../cli
      working-directory: tekton-catalog
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
